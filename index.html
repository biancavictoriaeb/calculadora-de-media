<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="painel">

        <h1>Calculadora de Média</h1>

        <p>Digite três notas para descobrir sua média.</p>

        <form id="formulario">

            <label>Primeira nota:</label>
            <input id="nota1" type="number" min="0" max="10" step="0.1" required>

            <label>Segunda nota:</label>
            <input id="nota2" type="number" min="0" max="10" step="0.1" required>

            <label>Terceira nota:</label>
            <input id="nota3" type="number" min="0" max="10" step="0.1" required>

            <button type="submit">Calcular média</button>

        </form>

        <p id="resultado"></p>

        <small>Média 7 ou mais = aprovado.</small>

    </div>

    <script src="script.js"></script>
</body>
</html>
